# Pipeline Configuration - Power Consumption Analyzer / NILM
# Phase 0: Centralized parameters schema (no hardcoded constants in code)

sampling:
  default_sampling_rate_hz: 30000.0   # Default high-frequency expectation (explicit per dataset)
  mains_frequency_hz: 50.0            # Grid frequency in India
  cycles_per_window: 2                # 2 full AC cycles (40 ms at 50Hz)

preprocessing:
  remove_dc_offset: true
  filter_type: "bandpass"             # or 'butterworth'
  filter_low_hz: 10.0
  filter_high_hz: 5000.0

windowing:
  duration_seconds: 0.1               # 100 ms window
  overlap_ratio: 0.5                  # 50% overlap for sliding windows
  transient_event_threshold_power_w: 30.0

vmd:
  K: 5                                # Number of decomposed variational modes
  alpha: 2000.0                       # Moderate bandwidth constraint
  tau: 0.0                            # Dual ascent time-step (0 for strict fidelity)
  DC: 0                               # 0 = no DC component retained in modes
  init: 1                             # 1 = initialize omegas uniformly
  tol: 1.0e-7                         # Convergence tolerance
  mode_ordering_rule: "center_frequency" # 'center_frequency' or 'energy'

features:
  per_mode:
    - "rms"
    - "variance"
    - "peak_to_peak"
    - "crest_factor"
    - "form_factor"
    - "spectral_centroid"
    - "mode_energy"
    - "thd"
  electrical:
    - "active_power_p"
    - "reactive_power_q"
    - "apparent_power_s"
    - "power_factor"

model:
  type: "random_forest"
  n_estimators: 100
  max_depth: 15
  min_samples_split: 2
  random_state: 42
  unknown_rejection_threshold: 0.60   # If max probability < 0.60, classify as "UNKNOWN"

evaluation:
  test_size: 0.20
  val_size: 0.15
  stratified: true
