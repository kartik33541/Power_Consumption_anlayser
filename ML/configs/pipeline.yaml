# Pipeline Configuration - Power Consumption Analyzer / NILM
# Phase 0: Centralized parameters schema (no hardcoded constants in code)

sampling:
  default_sampling_rate_hz: 30000.0   # Default high-frequency expectation (explicit per dataset)
  mains_frequency_hz: 60.0            # Nominal grid frequency (60Hz for PLAID/US, 50Hz for India/iAWE)
  cycles_per_window: 2                # 2 full AC cycles

preprocessing:
  remove_dc_offset: true
  dc_removal_method: "mean"           # 'mean' (zero phase distortion) or 'highpass'
  dc_offset_tolerance_v: 0.5          # Threshold for flagging abnormal DC in Voltage (V)
  dc_offset_tolerance_i: 0.005        # Threshold for flagging abnormal DC in Current (A, 5mA)
  detect_clipping: true
  clipping_consecutive_samples: 15    # Min consecutive flat extremum samples to declare hardware clipping
  clipping_relative_threshold: 0.99   # Relative threshold of dynamic range for clipping check
  normalize_amplitude: false          # MANDATE: False preserves physical units (A, V, W)
  grid_frequency_nominal_hz: 60.0     # Nominal grid frequency
  grid_frequency_tolerance_hz: 1.5    # Acceptable grid frequency drift (58.5 - 61.5 Hz)
  zero_crossing_channel: "voltage"    # Channel used for primary cycle segmentation

windowing:
  mode: "both"                        # 'event' (transient + steady), 'sliding', or 'both'
  duration_seconds: 0.1               # 100 ms window
  cycles_per_window: 6                # Exactly 6 full cycles @ 60Hz = 3,000 samples
  overlap_ratio: 0.5                  # 50% overlap for sliding windows
  transient_event_threshold_power_w: 30.0 # Delta P activation threshold (W)
  pre_event_cycles: 2                 # Cycles captured before turn-on step
  post_event_cycles: 4                # Cycles captured after turn-on step
  steady_state_settle_delay_sec: 0.40 # Wait 400ms after turn-on before steady extraction
  align_zero_crossing: true           # Lock window start to voltage zero-crossing

vmd:
  K: 5                                # Number of decomposed variational modes
  alpha: 2000.0                       # Default bandwidth constraint (steady state)
  alpha_transient: 500.0              # Adaptive bandwidth constraint for transient inrush steps
  tau: 0.1                            # Dual ascent time-step (enforces strict mathematical reconstruction)
  DC: 0                               # 0 = no DC component retained in modes
  init: 1                             # 1 = initialize omegas uniformly
  tol: 1.0e-7                         # Convergence tolerance
  min_reconstruction_snr_db: 15.0     # Minimum acceptable reconstruction SNR
  mode_ordering_rule: "center_frequency" # 'center_frequency' or 'energy'
  mode_clash_tolerance_hz: 15.0       # Minimum separation between distinct modes (Hz)

features:
  include_vmd: true                   # Enable multi-scale VMD sub-band features
  electrical:
    - "active_power_p"
    - "reactive_power_q"
    - "apparent_power_s"
    - "distortion_power_d"
    - "power_factor"
    - "displacement_power_factor"
    - "current_rms"
    - "voltage_rms"
    - "current_thd"
    - "voltage_thd"
    - "current_crest_factor"
    - "current_form_factor"
  per_mode:
    - "energy"
    - "energy_ratio"
    - "rms"
    - "variance"
    - "peak_to_peak"
    - "crest_factor"
    - "form_factor"
    - "skewness"
    - "kurtosis"
    - "center_frequency_hz"
    - "spectral_centroid"
    - "spectral_spread"
  raw_waveform:
    - "raw_current_rms"
    - "raw_current_crest_factor"
    - "raw_current_form_factor"
    - "raw_current_skewness"
    - "raw_current_kurtosis"
    - "raw_current_spectral_centroid"
    - "raw_current_spectral_spread"
  transient:
    - "transient_inrush_peak"
    - "transient_inrush_ratio"
    - "transient_ptp"

model:
  type: "random_forest"
  n_estimators: 100
  max_depth: 15
  min_samples_split: 2
  random_state: 42
  unknown_rejection_threshold: 0.60   # If max probability < 0.60, classify as "UNKNOWN"

evaluation:
  test_size: 0.20
  val_size: 0.15
  stratified: true
