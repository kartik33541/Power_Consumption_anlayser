    <link rel="preload" as="image" href="/media/hero-poster.966a6c70.webp" type="image/webp" fetchpriority="high" />

    <!-- Optimized Non-blocking Font Delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>

    <script>
      // Immediate theme initialization to prevent Flash of Unstyled/Wrong Theme (FOUT)
      (function() {
        try {
          var saved = localStorage.getItem('nilm-theme');
          var prefDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

        <h1 style="margin-top:0;">NILM Signal Lab — Non-Intrusive Load Monitoring</h1>

      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
