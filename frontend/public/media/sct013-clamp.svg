<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="clampBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="12" fill="#0b0f17" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Mains Wire (Live Conductor) -->
  <line x1="40" y1="150" x2="360" y2="150" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
  <text x="70" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">Live Mains Wire (230V)</text>

  <!-- SCT-013 Split Core Clamp -->
  <!-- Upper Half -->
  <path d="M 160 150 C 160 90, 240 90, 240 150 Z" fill="url(#clampBody)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Lower Half -->
  <path d="M 160 150 C 160 210, 240 210, 240 150 Z" fill="url(#clampBody)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Center Hole showing wire passing through untouched -->
  <circle cx="200" cy="150" r="24" fill="#0b0f17" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Hinge & Latch Mechanism -->
  <rect x="152" y="142" width="12" height="16" rx="3" fill="#cbd5e1"/>
  <rect x="236" y="142" width="12" height="16" rx="3" fill="#cbd5e1"/>

  <!-- Signal Output Cable (3.5mm Lead) -->
  <path d="M 200 205 L 200 250 Q 200 270 230 270 L 320 270" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <rect x="320" y="264" width="22" height="12" rx="3" fill="#64748b"/>

  <!-- Magnetic Flux Arrows -->
  <ellipse cx="200" cy="150" rx="34" ry="34" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <text x="200" y="45" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">SCT-013-030 CT Clamp</text>
  <text x="200" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff" text-anchor="middle">Non-Invasive Current Sensing (30A / 1V)</text>
  <text x="380" y="285" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="end">Illustrative Hardware Diagram</text>
</svg>
